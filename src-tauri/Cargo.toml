[package]
name = "live-subtitle-tool"
default-run = "live-subtitle-tool"
version = "0.1.0"
description = "Local Windows subtitle setup"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
tauri = { version = "2.11.5", features = [] }
wasapi = "0.24.0"
sha2 = "0.10.9"
